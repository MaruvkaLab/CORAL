name: coral-env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - bwa-mem2
  - samtools=1.17
  - ncbi-datasets-cli
  - numpy
  - pandas
  - click
  - biopython
  - pysam
  - ete3
  - psutil
  - matplotlib
  - unzip
  - pip
  - setuptools
  - wheel
  # Optional: PHYLIP (required for multi-species pipeline and run_phylip command)
  # Uncomment the following line if you need PHYLIP functionality:
  # - phylip

  # Optional: repeat masking (--repeat-mask, off by default).
  # blast provides windowmasker (the default backend); repeatmasker is only
  # needed for --repeat-mask repeatmasker.
  # - blast
  # - repeatmasker
