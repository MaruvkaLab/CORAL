[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coral"
version = "0.1.0"
description = "Read-based extraction of pairwise and lineage-specific substitution spectra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "biopython",
    "pysam",
    "matplotlib",
    "ete3",
    "psutil",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/MaruvkaLab/CORAL"

[project.scripts]
coral = "coral.cli:main"

[tool.setuptools]
packages = ["coral"]

[tool.setuptools.package-dir]
"" = "src"

